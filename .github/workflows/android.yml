name: Android CI
on:
  push:
    paths: ["android-app/**", ".github/workflows/android.yml"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Build + unit tests
        run: gradle assembleDebug testDebugUnitTest --no-daemon
      - name: Lint
        run: gradle lintDebug --no-daemon || { echo '--- LINT REPORT ---'; cat app/build/reports/lint-results-debug.txt 2>/dev/null; exit 1; }
